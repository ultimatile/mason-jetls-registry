---
name: Test

on:
  pull_request:
    paths:
      - 'packages/*/package.yaml'
      # Also run when the workflow itself changes, so edits to the download
      # and validation logic are exercised end-to-end before they land.
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test JETLS Installation (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            tag: linux-x64
            shim: bin/jetls
          - runner: macos-latest
            tag: macos-arm64
            shim: bin/jetls
          - runner: windows-latest
            tag: win-x64
            shim: bin/jetls.cmd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install yq (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install yq (macOS)
        if: matrix.runner == 'macos-latest'
        run: brew install yq

      - name: Install yq (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: choco install yq -y --no-progress

      - name: Download and extract asset
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_TAG: ${{ matrix.tag }}
          STAGE: ${{ runner.temp }}/jetls
        run: |
          set -eu
          ID=$(yq '.source.id' packages/jetls/package.yaml)
          REST=${ID#pkg:github/}
          REPO=${REST%@*}
          VERSION=${REST#*@}
          # Pin the upstream repo: this registry only ever consumes the single
          # jetls-sysimage source, so a PR may bump @version but must not redirect
          # the download elsewhere. Without this a fork PR could point source.id at
          # an attacker-controlled repo, and the asset below would be downloaded and
          # executed via the shim on the runner. The parsed $REPO is only used to
          # assert the manifest matches; the download itself uses the trusted
          # constant so the validated value is the value used (no check/use gap).
          EXPECTED_REPO="ultimatile/jetls-sysimage"
          if [ "$REPO" != "$EXPECTED_REPO" ]; then
            echo "Refusing to download from unexpected repo: $REPO (expected $EXPECTED_REPO)" >&2
            exit 1
          fi
          # Validate the tag shape at the source: reject empty, leading-dash, or
          # any value outside [A-Za-z0-9._-]. Defense in depth on top of quoting
          # and the repo pin, so the parsed value can never be re-interpreted as a
          # gh flag or smuggle special characters into the asset name below.
          case "$VERSION" in
            ''|-*|*[!A-Za-z0-9._-]*)
              echo "Refusing unexpected version tag: $VERSION" >&2
              exit 1 ;;
          esac
          ASSET="jetls-sysimage-${VERSION}-${PLATFORM_TAG}.zip"
          mkdir -p "$STAGE"
          gh release download "$VERSION" --repo "$EXPECTED_REPO" --pattern "$ASSET" --dir "$STAGE"
          (cd "$STAGE" && unzip -q "$ASSET")

      - name: Read the Julia the sysimage was built with
        id: julia
        # A sysimage links against libjulia.<major>.<minor> and will not load on
        # anything else, so the Julia to install here is a property of the asset,
        # not an independent choice. jetls-sysimage records it in the zip; reading
        # it removes the second, hand-maintained statement of the same fact that
        # used to sit in this workflow and go stale whenever the build moved.
        env:
          STAGE: ${{ runner.temp }}/jetls
        run: |
          set -eu
          FILE="$STAGE/share/jetls/JULIA_VERSION"
          # Fail closed. Assets published before jetls-sysimage recorded this
          # cannot be tested here: nothing else in the zip states which Julia
          # loads the sysimage, so guessing one would only turn a clear failure
          # into a confusing one.
          if [ ! -f "$FILE" ]; then
            echo "Asset has no share/jetls/JULIA_VERSION; it predates the recorded build Julia" >&2
            exit 1
          fi
          # Accept only a concrete release, in the same spirit as the tag check
          # above: setup-julia's version input also takes selectors such as
          # `nightly`, so an unexpected value would silently resolve to some
          # other Julia instead of failing here.
          JULIA_VERSION=$(cat "$FILE")
          if [[ ! "$JULIA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing unexpected Julia version: $JULIA_VERSION" >&2
            exit 1
          fi
          echo "version=$JULIA_VERSION" >> "$GITHUB_OUTPUT"

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ steps.julia.outputs.version }}

      - name: Test jetls executable
        env:
          STAGE: ${{ runner.temp }}/jetls
          SHIM: ${{ matrix.shim }}
        run: |
          "$STAGE/$SHIM" --version
