---
name: Test

on:
  pull_request:
    paths:
      - 'packages/*/package.yaml'
      # Also run when the workflow itself changes, so edits to the download
      # and validation logic are exercised end-to-end before they land.
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test JETLS Installation (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            tag: linux-x64
            shim: bin/jetls
          - runner: macos-latest
            tag: macos-arm64
            shim: bin/jetls
          - runner: windows-latest
            tag: win-x64
            shim: bin/jetls.cmd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Install yq (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install yq (macOS)
        if: matrix.runner == 'macos-latest'
        run: brew install yq

      - name: Install yq (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: choco install yq -y --no-progress

      - name: Download and extract asset
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_TAG: ${{ matrix.tag }}
          STAGE: ${{ runner.temp }}/jetls
        run: |
          set -eu
          ID=$(yq '.source.id' packages/jetls/package.yaml)
          REST=${ID#pkg:github/}
          REPO=${REST%@*}
          VERSION=${REST#*@}
          # Pin the upstream repo: this registry only ever consumes the single
          # jetls-sysimage source, so a PR may bump @version but must not redirect
          # the download elsewhere. Without this a fork PR could point source.id at
          # an attacker-controlled repo, and the asset below would be downloaded and
          # executed via the shim on the runner. The parsed $REPO is only used to
          # assert the manifest matches; the download itself uses the trusted
          # constant so the validated value is the value used (no check/use gap).
          EXPECTED_REPO="ultimatile/jetls-sysimage"
          if [ "$REPO" != "$EXPECTED_REPO" ]; then
            echo "Refusing to download from unexpected repo: $REPO (expected $EXPECTED_REPO)" >&2
            exit 1
          fi
          # Validate the tag shape at the source: reject empty, leading-dash, or
          # any value outside [A-Za-z0-9._-]. Defense in depth on top of quoting
          # and the repo pin, so the parsed value can never be re-interpreted as a
          # gh flag or smuggle special characters into the asset name below.
          case "$VERSION" in
            ''|-*|*[!A-Za-z0-9._-]*)
              echo "Refusing unexpected version tag: $VERSION" >&2
              exit 1 ;;
          esac
          ASSET="jetls-sysimage-${VERSION}-${PLATFORM_TAG}.zip"
          mkdir -p "$STAGE"
          gh release download "$VERSION" --repo "$EXPECTED_REPO" --pattern "$ASSET" --dir "$STAGE"
          (cd "$STAGE" && unzip -q "$ASSET")

      - name: Test jetls executable
        env:
          STAGE: ${{ runner.temp }}/jetls
          SHIM: ${{ matrix.shim }}
        run: |
          "$STAGE/$SHIM" --version
