---
name: Test

on:
  pull_request:
    paths:
      - 'packages/*/package.yaml'
  workflow_dispatch:

jobs:
  test:
    name: Test JETLS Installation (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            tag: linux-x64
            shim: bin/jetls
          - runner: macos-latest
            tag: macos-arm64
            shim: bin/jetls
          - runner: windows-latest
            tag: win-x64
            shim: bin/jetls.cmd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Install yq (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install yq (macOS)
        if: matrix.runner == 'macos-latest'
        run: brew install yq

      - name: Install yq (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: choco install yq -y --no-progress

      - name: Download and extract asset
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_TAG: ${{ matrix.tag }}
          STAGE: ${{ runner.temp }}/jetls
        run: |
          set -eu
          ID=$(yq '.source.id' packages/jetls/package.yaml)
          REST=${ID#pkg:github/}
          REPO=${REST%@*}
          VERSION=${REST#*@}
          ASSET="jetls-sysimage-${VERSION}-${PLATFORM_TAG}.zip"
          mkdir -p "$STAGE"
          gh release download "$VERSION" --repo "$REPO" --pattern "$ASSET" --dir "$STAGE"
          (cd "$STAGE" && unzip -q "$ASSET")

      - name: Test jetls executable
        env:
          STAGE: ${{ runner.temp }}/jetls
          SHIM: ${{ matrix.shim }}
        run: |
          "$STAGE/$SHIM" --version
